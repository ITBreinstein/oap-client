# Two pygeoapi instances from one pinned image: the same API, differing only in
# whether it sends CORS headers. :5080 exercises the direct-fetch path, :5081
# forces the relay fallback — see the browser-constraints rule in the agent
# notes.
#
# Both mount ../pygeoapi/plugins on PYTHONPATH so the repository's own
# processors (`slow` and the `breinstein-*` family, one file each under
# infra/pygeoapi/plugins/) load as ordinary pygeoapi plugins without
# rebuilding the image. See infra/README.md.
#
# Both can reach the host as `host.docker.internal`, which is where the relay's
# callback receiver listens when it runs outside Docker (infra/relay/). Docker
# Desktop provides the name on its own; Linux, and so CI, needs the mapping
# below. It is harmless where the name already resolves.
#
# Pinned by digest; the tag is there to be read. infra/README.md says how to move it.
services:
  pygeoapi-cors:
    image: geopython/pygeoapi:0.21.0@sha256:34b409a5c4317e3c222ab85068a7ecccd00f50eb5455a149e83cb4e884e132bc
    ports: ["5080:80"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      PYTHONPATH: /pygeoapi/plugins
    volumes:
      - "../pygeoapi/config-cors.yml:/pygeoapi/local.config.yml:ro"
      - "../pygeoapi/plugins:/pygeoapi/plugins:ro"
    # So `up --wait` returns once gunicorn answers, not once the container
    # exists: the image has no healthcheck of its own, and a lane that started
    # before pygeoapi listened used to skip its tests (review T3).
    healthcheck: &answering
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:80/?f=json', timeout=5)"
      interval: 5s
      timeout: 6s
      retries: 30
      start_period: 5s
  pygeoapi-nocors:
    image: geopython/pygeoapi:0.21.0@sha256:34b409a5c4317e3c222ab85068a7ecccd00f50eb5455a149e83cb4e884e132bc
    ports: ["5081:80"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    environment:
      PYTHONPATH: /pygeoapi/plugins
    volumes:
      - "../pygeoapi/config-nocors.yml:/pygeoapi/local.config.yml:ro"
      - "../pygeoapi/plugins:/pygeoapi/plugins:ro"
    healthcheck: *answering
