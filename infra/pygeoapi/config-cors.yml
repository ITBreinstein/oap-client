# pygeoapi with CORS on — exercises the direct-fetch path.
server:
  bind: { host: 0.0.0.0, port: 80 }
  url: http://localhost:5080
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  language: en-US
  cors: true
  pretty_print: true
  limit: 10
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  manager:
    name: TinyDB
    connection: /tmp/pygeoapi-process-manager.db
    output_dir: /tmp

logging:
  level: INFO

metadata:
  identification:
    title: { en: pygeoapi (CORS enabled) }
    description: { en: Reference OGC API - Processes server for the verify lane }
    keywords: { en: [processes, testbed] }
    keywords_type: theme
    terms_of_service: https://creativecommons.org/licenses/by/4.0/
    url: https://example.org
  license:
    name: CC-BY 4.0 license
    url: https://creativecommons.org/licenses/by/4.0/
  provider:
    name: Breinstein
    url: https://example.org
  contact:
    name: Breinstein
    email: dev@example.org
    role: pointOfContact

resources:
  hello-world:
    type: process
    processor:
      name: HelloWorld
  # A process that is still running when the second poll arrives. Registered
  # because `hello-world` finishes before the first poll returns, which makes
  # every asynchronous code path — `running`, progress, Retry-After, dismissal
  # of a live job — unobservable. Source and rationale:
  # infra/pygeoapi/plugins/breinstein_slow.py, documented in infra/README.md.
  slow:
    type: process
    processor:
      name: breinstein_slow.SlowProcessor
  # Three of the remaining coverage-gap processes, one hole each. Sources and
  # rationale: infra/pygeoapi/plugins/breinstein_*.py, documented in
  # infra/README.md. All three echo or reshape their inputs and compute nothing.
  #
  # A bounding-box input shaped as the census found them (format: ogc-bbox),
  # returned as a GeoJSON Feature.
  breinstein-bbox:
    type: process
    processor:
      name: breinstein_bbox.BboxProcessor
  # One input of every kind the form generator renders, and two outputs; echoes
  # what it received so a browser test can assert on what arrived.
  breinstein-inputs:
    type: process
    processor:
      name: breinstein_inputs.InputsProcessor
  # A non-JSON output: a small generated image/png.
  breinstein-png:
    type: process
    processor:
      name: breinstein_png.PngProcessor
  # A GeoJSON polygon in, the same polygon rotated a quarter turn out. Source
  # and rationale: infra/pygeoapi/plugins/breinstein_rotate.py, documented in
  # infra/README.md.
  breinstein-rotate:
    type: process
    processor:
      name: breinstein_rotate.RotateProcessor
  # A GeoJSON polygon in, the aerial photograph of its bounding box and that
  # box out; fetched from PDOK, so it needs the network. Source and rationale:
  # infra/pygeoapi/plugins/breinstein_aerial.py, documented in infra/README.md.
  breinstein-aerial:
    type: process
    processor:
      name: breinstein_aerial.AerialProcessor
