# Weaver for the v2 lane (`pnpm test:e2e:weaver`), on :5100.
#
# Weaver is the one server found that declares OGC API - Processes 2.0
# (`…/ogcapi-processes-1/2.0/conf/core`), which is why it is here. Trimmed
# from Weaver's own config/weaver.ini.example to what this lane needs: no
# Docker access for the worker, so no deployed CWL packages; the builtin
# EchoProcess is the process the lane runs.
#
# `weaver.wps_url` names the API by a dotted alias. A bare container name
# (`weaver-api`) makes the landing page answer 500 and the process list 503:
# Weaver validates every link it writes as a URL, and refuses a host with no
# dot in it.

[app:main]
use = egg:crim-weaver
mongodb.host = mongodb
mongodb.port = 27017
mongodb.db_name = weaver
weaver.configuration = HYBRID
weaver.url = http://localhost:5100
weaver.execute_sync_max_wait = 20
weaver.quotation = false
weaver.wps = true
weaver.wps_url = http://weaver.internal:4001/ows/wps
weaver.wps_path = /ows/wps
weaver.wps_output = true
weaver.wps_output_dir = /tmp/weaver/wps-outputs
weaver.wps_output_url = http://localhost:5100/wpsoutputs
weaver.wps_output_path = /wpsoutputs
weaver.wps_restapi = true
weaver.wps_restapi_path = /
weaver.wps_restapi_html = true
weaver.wps_processes_file = wps_processes.yml
weaver.vault = true
weaver.vault_dir = /tmp/vault

[celery]
BROKER_URL = mongodb://mongodb:27017/celery
RESULT_BACKEND = mongodb://mongodb:27017/celery

[server:main]
use = egg:gunicorn#main
bind = 0.0.0.0:4001
workers = 2
timeout = 30

[loggers]
keys = root, weaver, celery

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_weaver]
level = INFO
handlers = console
qualname = weaver
propagate = 0

[logger_celery]
level = INFO
handlers = console
qualname = celery
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = [%(asctime)s] %(levelname)-8.8s [%(name)s] %(message)s
