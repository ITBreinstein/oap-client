name: watchdog

# Tests that assert a known defect is *still there*.
#
# Read this lane backwards: the pool test is `it.fails`, so a red pool test is
# the expected state and a green one is the alarm — it would mean ZOO stopped
# losing asynchronous workers and finding 0044 needs rewriting. See
# packages/core/test/watch/zoo-worker-pool.test.ts.
#
# Separate from `interop` because it depletes the server on purpose, takes
# minutes, and inverts the meaning of a red run. Monthly: the thing it watches
# for is an upstream release, not a commit of ours.
#
# ## Three outcomes, and how to tell them apart
#
# The job used to be `continue-on-error` at the job level, which made all three
# look identical from the Actions list. It no longer is:
#
# | outcome        | job     | how to recognise it                                  |
# | -------------- | ------- | ---------------------------------------------------- |
# | normal         | green   | pool.json present, verdict in the summary            |
# | broken run     | **red** | "no measurement", or "the pool test did not run"     |
# | watchdog alarm | **red** | "ALARM"; the summary says what to do about it        |
#
# A broken run is a failed ZOO build, a container that never came up, a
# refresh that failed, a characterisation that produced nothing, or a pool
# test that was skipped because ZOO did not answer — none of which say
# anything about ZOO's behaviour, and all of which once passed silently or
# read as the alarm (review T5). The list-versus-document check and the
# pool-size tripwire are red on their own, and named as such.
#
# Both red states fail the job, for opposite reasons, and the run summary is
# what tells them apart. The alarm fails on purpose: an alarm nobody is
# interrupted by is not an alarm. The watchdog step itself keeps
# `continue-on-error` so that the verdict step still runs and still explains
# itself — the job outcome is decided there, not by the test step.
on:
  schedule: [{ cron: "0 6 1 * *" }]
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # The full stack, built from the pinned fork. Budget for the kernel
      # compile; the runner is native amd64, so no emulation on top of it.
      # Not tolerated: a stack that will not start is a broken run.
      - name: start ZOO
        run: ./infra/zoo/zoo.sh up

      # Re-measure the pool on native amd64. The numbers in finding 0044 were
      # taken on Apple Silicon, where ZOO's amd64-only image runs under Rosetta;
      # this is the architecture check that keeps the finding honest. Runs
      # before the tests, on the pool `zoo.sh up` just created.
      #
      # `pipefail` matters here: without it the exit status is `tee`'s, so a
      # script that dies on its first request still writes an empty pool.json
      # and reports success. That is exactly the silent-broken-run case.
      - name: characterise the worker pool
        shell: bash
        run: |
          set -o pipefail
          node infra/zoo/characterise-pool.mjs 4 4 4 4 4 4 | tee pool.json
        continue-on-error: true

      # The measurement is the deliverable, so its absence fails the job. An
      # empty or truncated file counts as absent: `jq` has to find at least one
      # wave carrying a worker count, or there is nothing to record in 0044.
      - name: the measurement must exist
        shell: bash
        run: |
          if [ ! -s pool.json ]; then
            echo "::error::the watchdog produced no measurement (pool.json is missing or empty)"
            exit 1
          fi
          waves=$(jq 'length' pool.json 2>/dev/null || echo 0)
          counted=$(jq '[.[] | select(.poolBefore != null)] | length' pool.json 2>/dev/null || echo 0)
          echo "waves=$waves with-worker-counts=$counted"
          if [ "$waves" -lt 1 ] || [ "$counted" -lt 1 ]; then
            echo "::error::pool.json holds no usable wave; the run says nothing about ZOO"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with: { name: pool-characterisation, path: pool.json, if-no-files-found: error }

      # The two watch files run apart, each on a freshly refreshed pool, each
      # with a JSON report the verdict reads test by test (review T5). Run as
      # one `pnpm test:watchdog`, any red at all — an ordinary test, the
      # pool-size tripwire, the refresh itself — read as the 0044 alarm, and a
      # run where ZOO never answered skipped everything and read as "0044
      # still holds".
      #
      # A refresh that fails stops the job: nothing after it would mean
      # anything. The verdict still runs and says so.
      - name: refresh the pool for the list check
        run: ./infra/zoo/zoo.sh refresh

      # Ordinary assertions: ZOO's job list agrees with the job's own document.
      # Red here is a finding of its own, not the alarm; see that file.
      - name: job list versus job document
        run: >-
          pnpm exec vitest run --config packages/core/vitest.watchdog.config.ts
          test/watch/zoo-list-vs-document.test.ts
          --reporter=default --reporter=json --outputFile.json="$GITHUB_WORKSPACE/list.json"
        continue-on-error: true

      - name: refresh the pool for the watchdog
        run: ./infra/zoo/zoo.sh refresh

      # The `it.fails` pool test and its tripwire. `continue-on-error` does not
      # mean the outcome is tolerated: the verdict below decides the job, and
      # the observations are still uploaded.
      - name: watchdog test
        run: >-
          pnpm exec vitest run --config packages/core/vitest.watchdog.config.ts
          test/watch/zoo-worker-pool.test.ts
          --reporter=default --reporter=json --outputFile.json="$GITHUB_WORKSPACE/watchdog.json"
        continue-on-error: true

      # Always runs, including after a failed measurement or refresh, so the run
      # summary says what this run was without anyone opening a log. Read from
      # the reports, never from a step's outcome: `it.fails` turns the pool
      # test's expected failure into a pass, so only the test's own status says
      # which way it went, and a skipped test is a broken run, not a verdict.
      - name: verdict
        if: always()
        shell: bash
        run: |
          # The status of every test in a report, or nothing when the report is
          # missing or did not parse.
          statuses() {
            jq -r '.testResults[].assertionResults[] | "\(.status)\t\(.title)"' "$1" 2>/dev/null || true
          }
          pool=$(statuses watchdog.json | awk -F'\t' 'index($2, "still runs a new job after") == 1 { print $1 }')
          tripwire=$(statuses watchdog.json | awk -F'\t' 'index($2, "still runs a new job after") != 1 && $1 != "passed"')
          list_total=$(statuses list.json | wc -l | tr -d ' ')
          list_bad=$(statuses list.json | awk -F'\t' '$1 != "passed"')

          # One of: expected, alarm, broken. `it.fails` reports its expected
          # failure as "passed" and a healthy server as "failed".
          case "$pool" in
            passed) verdict=expected ;;
            failed) verdict=alarm ;;
            *) verdict=broken ;;
          esac
          {
            echo "## Watchdog verdict"
            echo
            if [ -s pool.json ]; then
              echo '| wave | workers before | workers after | wall (s) |'
              echo '| ---- | -------------- | ------------- | -------- |'
              jq -r '.[] | "| N=\(.n) | \(.poolBefore) | \(.poolAfter) | \(.wallMs / 1000 | floor) |"' \
                pool.json || echo '(pool.json did not parse)'
              echo
            else
              echo '**No measurement.** This run says nothing about ZOO.'
              echo
            fi
            case "$verdict" in
              expected)
                echo 'Watchdog test failed, as expected: finding 0044 still holds.'
                ;;
              alarm)
                echo '> **ALARM — the watchdog went green.**'
                echo '>'
                echo '> The pool test is `it.fails`, so it failing means its assertion'
                echo '> *passed*: a new job still completed after two dozen others.'
                echo '> ZOO may have stopped losing workers. Re-measure with'
                echo '> `infra/zoo/characterise-pool.mjs`, then rewrite finding 0044.'
                echo '> Do not delete the test, and do not drop the `zoo.sh refresh`'
                echo '> pretask on `pnpm test:interop`, until that is done.'
                ;;
              broken)
                echo "**Broken run: the pool test did not run** (status: \`${pool:-no report}\`)."
                echo 'ZOO did not answer, a refresh failed, or the test file did not load.'
                echo 'This run says nothing about finding 0044.'
                ;;
            esac
            echo
            if [ -n "$tripwire" ]; then
              echo '**The pool-size tripwire did not pass**, so the pool test above'
              echo 'may be measuring the wrong thing:'
              echo '```'
              echo "$tripwire"
              echo '```'
              echo
            fi
            if [ "$list_total" = 0 ]; then
              echo '**The list-versus-document check did not run.**'
            elif [ -n "$list_bad" ]; then
              echo '**ZOO'"'"'s job list and job document disagreed**, or the check did'
              echo 'not run in full. Not the 0044 alarm: see'
              echo '`packages/core/test/watch/zoo-list-vs-document.test.ts` for what it means.'
              echo '```'
              echo "$list_bad"
              echo '```'
            else
              echo 'Job list and job document agreed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          # Every red state fails the job, and the summary says which it was.
          # The alarm fails on purpose: a monthly run whose only signal is a
          # line in a summary nobody opens is not a signal.
          failed=no
          if [ "$verdict" = alarm ]; then
            echo "::error::ALARM: the watchdog passed, so finding 0044 may no longer hold. Re-measure before changing anything."
            failed=yes
          fi
          if [ "$verdict" = broken ]; then
            echo "::error::the pool test did not run (status: ${pool:-no report}); this run says nothing about finding 0044"
            failed=yes
          fi
          if [ -n "$tripwire" ]; then
            echo "::error::the pool-size tripwire did not pass"
            failed=yes
          fi
          if [ "$list_total" = 0 ] || [ -n "$list_bad" ]; then
            echo "::error::the job list versus job document check did not pass"
            failed=yes
          fi
          if [ "$failed" = yes ]; then
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: observations, path: observations/, if-no-files-found: warn }
