name: verify
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:smoke
      - run: pnpm exec playwright install --with-deps chromium
      # pygeoapi reaches the relay's callback receiver on this runner as
      # host.docker.internal — mapped to the host gateway in the compose file,
      # because Linux does not provide the name the way Docker Desktop does.
      - run: docker compose -f infra/compose/pygeoapi.yml up -d --wait
      # The core's contract lane, then the relay's: real callbacks from pygeoapi.
      - run: pnpm test:contract
      # The blocking browser lane: starts its own relay with e2e/relay.json
      # (callbacks on for pygeoapi) and a web build that knows its URL, on the
      # lane's own ports. ZOO has a lane of its own in interop.yml. See
      # playwright.config.ts.
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: .playwright/report/ }

  # The relay's container image: it builds, starts on a port of its own, and
  # reports healthy there (review R13).
  relay-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/relay/Dockerfile -t oap-relay .
      - run: |
          docker run -d --name relay -e PORT=9000 oap-relay
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' relay)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 1
          done
          docker logs relay
          echo "the relay image never reported healthy (last: $status)"
          exit 1
