name: verify
on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # Node is pinned to the exact version, in every workflow: a floating `24`
      # moved to 24.22.1 on 2026-10-29 and broke a relay streaming test that
      # passed on 24.21.0. Move the pin on purpose, with the suite green.
      - uses: actions/setup-node@v4
        with: { node-version: 24.21.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:smoke
      - run: pnpm exec playwright install --with-deps chromium
      # pygeoapi reaches the relay's callback receiver on this runner as
      # host.docker.internal — mapped to the host gateway in the compose file,
      # because Linux does not provide the name the way Docker Desktop does.
      - run: docker compose -f infra/compose/pygeoapi.yml up -d --wait
      # The core's contract lane, then the relay's: real callbacks from pygeoapi.
      - run: pnpm test:contract
      # The blocking browser lane: starts its own relay with e2e/relay.json
      # (callbacks on for pygeoapi) and a web build that knows its URL, on the
      # lane's own ports. ZOO has a lane of its own in interop.yml. See
      # playwright.config.ts.
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: playwright-report, path: .playwright/report/ }

  # The core claims Node 18 or later (`engines`, its README), and the smoke
  # lane above runs its node consumer on 24 only. This runs the same consumer,
  # from the same packed tarball, on 18 (review T11). Only the consumer: pnpm
  # and the build tools need the 24 the repository asks for, so 18 is set up
  # first, its binary remembered, and 24 put back in front of it.
  core-on-node-18:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 18 }
      - run: echo "SMOKE_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 24.21.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:smoke

  # The relay's container image: it builds, starts on a port of its own, and
  # reports healthy there (review R13).
  relay-image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/relay/Dockerfile -t oap-relay .
      # As it is deployed: the flags deploy.sh uses, on its own network, with
      # the port published on loopback only, and the production config (no
      # private addresses, no allowance).
      - name: Run the image with the production flags
        shell: bash
        run: |
          source deploy/relay/run-flags.sh
          docker network create --subnet "$RELAY_SUBNET" --ip-range "$RELAY_IP_RANGE" \
            --gateway "$RELAY_GATEWAY" "$RELAY_NETWORK"
          docker run -d --name relay "${RELAY_RUN_FLAGS[@]}" "${RELAY_PUBLISH[@]}" \
            -v "$PWD/deploy/relay/relay.json:/config.json:ro" oap-relay
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' relay)
            if [ "$status" = healthy ]; then break; fi
            sleep 1
          done
          if [ "$status" != healthy ]; then
            docker logs relay
            echo "the relay image never reported healthy with the production flags (last: $status)"
            exit 1
          fi
          curl --fail --silent --show-error http://127.0.0.1:8787/healthz
          echo
          set -x
          [ "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' relay)" = true ]
          [ "$(docker inspect -f '{{.HostConfig.CapDrop}}' relay)" = "[ALL]" ]
          [ "$(docker inspect -f '{{.HostConfig.SecurityOpt}}' relay)" = "[no-new-privileges]" ]
          [ "$(docker inspect -f '{{.HostConfig.Memory}}' relay)" = 268435456 ]
          [ "$(docker inspect -f '{{index .HostConfig.LogConfig.Config "max-file"}}' relay)" = 5 ]
          [ "$(docker inspect -f '{{(index (index .HostConfig.PortBindings "8787/tcp") 0).HostIp}}' relay)" = 127.0.0.1 ]
          [ -z "$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' relay | grep RELAY_ALLOW_PRIVATE_ADDRESSES)" ]
      # The health check reads PORT, so a relay moved to another port is still
      # checked where it listens.
      - name: Run the image on another port
        run: |
          docker run -d --name relay-port -e PORT=9000 oap-relay
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' relay-port)
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 1
          done
          docker logs relay-port
          echo "the relay image never reported healthy (last: $status)"
          exit 1
