name: interop
on:
  schedule: [{ cron: "0 5 * * 1" }]
  workflow_dispatch:

# Live third-party servers change under us; this lane reports, it never blocks.
jobs:
  interop:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:interop
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with: { name: observations, path: observations/, if-no-files-found: warn }
